[package]
name = "e"
version = "0.1.13"
edition = "2024"
license = "MIT"
description = "A small terminal text editor"

[dependencies]
laputa-hi-lite = "0.2"
fxhash = "0.2"
regex-lite = "0.1"
rustix = { version = "1.1.4", features = ["runtime", "termios"] }

[dev-dependencies]
rustybench = "0.1"
laputa-ptytest = "0.1.1"
proptest = "1"

[[bench]]
name = "bench"
harness = false

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
