[package]
name = "e"
version = "0.1.13"
edition = "2024"
license = "MIT"
description = "A small terminal text editor"

[dependencies]
laputa-hi-lite = { version = "0.4.0", registry = "stuff-native" }
rustc-hash = "2.1"
regex-lite = "0.1"
libc = { version = "0.2" }
rustix = { package = "laputa-rustix", version = "=1.1.6", registry = "stuff-native", features = ["termios"] }

[dev-dependencies]
rustybench = "0.5"
laputa-ptytest = "0.4.0"
quickcheck = { version = "1", default-features = false }

[[bench]]
name = "bench"
harness = false

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
